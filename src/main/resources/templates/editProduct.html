<!-- Edit Product page for Coffee Shop -->
<!-- Extends defaultTemplate.html for consistent navigation and layout -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/defaultTemplate}">

<head>
	<title>Edit Product – Summit Roast</title>
	<style>
		:root {
			--bg: #1B3B2B;
			--card: #F1F5F2;
			--green: #2D5A43;
			--accent: #4E8766;
			--foam: #D9E4DD;
			--muted: #5D7065;
		}

		.card {
			max-width: 500px;
			margin: 3rem auto;
			padding: 36px;
			background: var(--card);
			border-radius: 12px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
			font-family: 'DM Sans', sans-serif;
		}

		h2 {
			font-family: 'Playfair Display', serif;
			font-size: 22px;
			color: var(--bg);
			margin-bottom: 20px;
		}

		.row-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 14px;
		}

		.field {
			margin-bottom: 16px;
		}

		label {
			display: block;
			font-size: 12px;
			font-weight: bold;
			color: var(--green);
			margin-bottom: 5px;
			text-transform: uppercase;
		}

		input, select {
			width: 100%;
			padding: 10px 12px;
			border: 1.5px solid var(--foam);
			border-radius: 7px;
			font-size: 14px;
			color: var(--bg);
			background: #fff;
			outline: none;
		}

		input:focus, select:focus {
			border-color: var(--accent);
			box-shadow: 0 0 0 3px rgba(78, 135, 102, 0.15);
		}

		.btn-row {
			display: flex;
			gap: 10px;
			margin-top: 8px;
		}

		.btn {
			flex: 1;
			padding: 11px;
			border: none;
			border-radius: 7px;
			font-size: 14px;
			font-weight: 500;
			cursor: pointer;
			text-align: center;
			text-decoration: none;
		}

		.btn-primary {
			background: var(--bg);
			color: var(--card);
		}

		.btn-primary:hover {
			background: var(--green);
		}

		.btn-secondary {
			background: var(--foam);
			color: var(--bg);
		}

		.btn-secondary:hover {
			background: #C8D7CD;
		}
	</style>
</head>

<body>
	<div layout:fragment="content">
		<div class="card text-start">
			<h2>✏️ Edit Product</h2>

			<form th:action="@{/product/edit/{id}(id=${productModel.id})}" th:object="${productModel}" method="post">

				<div class="field">
					<label for="name">Product Name</label>
					<input type="text" id="name" th:field="*{name}" />
				</div>

				<div class="field">
					<label for="description">Description</label>
					<input type="text" id="description" th:field="*{description}" />
				</div>

				<div class="row-grid">
					<div class="field">
						<label for="quantity">Quantity</label>
						<input type="number" id="quantity" th:field="*{quantity}" min="0" />
					</div>
					<div class="field">
						<label for="price">Price ($)</label>
						<input type="number" id="price" th:field="*{price}" min="0" step="0.01" />
					</div>
				</div>

				<div class="btn-row">
					<a th:href="@{/product}" class="btn btn-secondary">Cancel</a>
					<button type="submit" class="btn btn-primary">Save Changes</button>
				</div>

			</form>
		</div>
	</div>

</body>

</html>
