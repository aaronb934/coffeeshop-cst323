<!DOCTYPE html>
<!-- Default layout template for Summit Roast Inventory Manager -->
<!-- All pages extend this template for consistent navigation and styling -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Coffee Shop Inventory Management</title>
	<!-- Bootstrap CSS for styling -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

	<!-- Main navigation bar shown on every page -->
	<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #1B3B2B;">
		<div class="container">
			<!-- App brand/logo -->
			<a class="navbar-brand" th:href="@{/product}">Inventory Portal</a>

			<!-- Collapse button for mobile screens -->
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">

					<!-- Home link -->
					<li class="nav-item">
						<a class="nav-link" th:href="@{/}">Home</a>
					</li>

					<!-- Login link -->
					<li class="nav-item">
						<a class="nav-link" th:href="@{/login}">Login</a>
					</li>

					<!-- Register link -->
					<li class="nav-item">
						<a class="nav-link" th:href="@{/register}">Register</a>
					</li>

					<!-- Add Product link -->
					<li class="nav-item">
						<a class="nav-link" th:href="@{/product/create}">Add Product</a>
					</li>

					<li class="nav-item">
						<form th:action="@{/logout}" method="post" style="display:inline;">
							<button type="submit" class="nav-link btn btn-link"
								style="color:rgba(255,255,255,0.75); text-decoration:none;">
								Sign Out
							</button>
						</form>
					</li>

				</ul>
			</div>
		</div>
	</nav>

	<!-- Main content area -->
	<div class="container my-5">
		<div class="row justify-content-center">
			<div class="col-md-8 text-center">

				<h1 class="display-5 fw-bold text-dark mb-3">Coffee Shop Inventory System</h1>

				<!-- Content fragment injected by each page -->
				<div layout:fragment="content"></div>

			</div>
		</div>
	</div>

	<!-- Bootstrap JS for navbar collapse -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
