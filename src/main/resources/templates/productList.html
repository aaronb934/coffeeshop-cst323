<!-- View Product page for Coffee Shop -->
<!-- Extends defaultTemplate.html for consistent navigation and layout -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/defaultTemplate}">

<head>
	<title>Product List – Summit Roast</title>
	<style>
		:root {
			--bg: #1B3B2B;
			--card: #F1F5F2;
			--green: #2D5A43;
			--accent: #4E8766;
			--foam: #D9E4DD;
			--muted: #5D7065;
		}

		.card {
			max-width: 800px;
			margin: 3rem auto;
			padding: 36px;
			background: var(--card);
			border-radius: 12px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
			font-family: 'DM Sans', sans-serif;
		}

		h2 {
			font-family: 'Playfair Display', serif;
			font-size: 22px;
			color: var(--bg);
			margin-bottom: 20px;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			margin-bottom: 20px;
		}

		th {
			background-color: var(--bg);
			color: #fff;
			padding: 12px;
			text-align: left;
			font-size: 13px;
			text-transform: uppercase;
		}

		td {
			padding: 12px;
			border-bottom: 1px solid var(--foam);
			color: var(--bg);
			font-size: 14px;
		}

		.btn {
			padding: 8px 12px;
			border: none;
			border-radius: 7px;
			font-size: 13px;
			font-weight: 500;
			cursor: pointer;
			text-decoration: none;
			display: inline-block;
		}

		.btn-primary {
			background: var(--bg);
			color: var(--card);
		}

		.btn-primary:hover {
			background: var(--green);
		}

		.btn-secondary {
			background: var(--foam);
			color: var(--bg);
		}

		.btn-secondary:hover {
			background: #C8D7CD;
		}

		.btn-danger {
			background: #B94040;
			color: #fff;
		}

		.btn-danger:hover {
			background: #9A3535;
		}
	</style>
</head>

<body>
	<div layout:fragment="content">
		<div class="card text-start">
			
			<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
				<h2 style="margin: 0;">Inventory List</h2>
				<a th:href="@{/product/create}" class="btn btn-primary">Add Product</a>
			</div>

			<table>
				<thead>
					<tr>
						<th>Name</th>
						<th>Description</th>
						<th>Price</th>
						<th>Quantity</th>
						<th style="text-align: center;">Actions</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="product : ${products}">
						<td th:text="${product.name}"></td>
						<td th:text="${product.description}"></td>
						<td th:text="'$' + ${product.price}"></td>
						<td th:text="${product.quantity}"></td>
						<td style="text-align: center;">
							<a th:href="@{/product/edit/{id}(id=${product.id})}" class="btn btn-secondary" style="margin-right: 5px;">Edit</a>
							<form th:action="@{/product/delete/{id}(id=${product.id})}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this product?');">
								<button type="submit" class="btn btn-danger">Delete</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>

			<div th:if="${#lists.isEmpty(products)}" style="text-align: center; color: var(--muted); margin-top: 20px;">
				No products found. Click Add Product to get started.
			</div>

		</div>
	</div>
</body>

</html>
