# Using environment variables for database credentials instead of hardcoding.
# This allows the same codebase to deploy to both Heroku and Azure 
# for the Activity 3 screencast without requiring mid-video code changes.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.maximumPoolSize=5